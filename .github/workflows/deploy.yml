name: Validate and deploy
# Deployment credentials are maintained through repository secrets.
on:
  push:
    branches:
      - main
      - feature/scenario-generic-pipeline
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm test
      - run: npm run type-check
      - run: npm run build

  deploy:
    needs: validate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/scenario-generic-pipeline')
    runs-on: ubuntu-24.04
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ github.ref == 'refs/heads/feature/scenario-generic-pipeline' && secrets.VERCEL_SCENARIO_PROJECT_ID || (github.ref == 'refs/heads/main' && secrets.VERCEL_PROJECT_ID || '') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - name: Verify Vercel credentials and project access
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        run: |
          npx --yes vercel@latest whoami --token="$VERCEL_TOKEN"
          npx --yes vercel@latest project inspect "$VERCEL_PROJECT_ID" --scope="$VERCEL_ORG_ID" --token="$VERCEL_TOKEN"
      - name: Link the branch to its Vercel project
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        run: npx --yes vercel@latest link --yes --scope="$VERCEL_ORG_ID" --project="$VERCEL_PROJECT_ID" --token="$VERCEL_TOKEN"
      - name: Pull Vercel project settings
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        run: npx --yes vercel@latest pull --yes --scope="$VERCEL_ORG_ID" --project="$VERCEL_PROJECT_ID" --environment=production --token="$VERCEL_TOKEN"
      - name: Build Vercel output
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        run: npx --yes vercel@latest build --prod --scope="$VERCEL_ORG_ID" --token="$VERCEL_TOKEN"
      - name: Deploy with Vercel
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        run: npx --yes vercel@latest deploy --prebuilt --prod --scope="$VERCEL_ORG_ID" --token="$VERCEL_TOKEN"
      - name: Explain skipped deployment
        if: ${{ env.VERCEL_TOKEN == '' || env.VERCEL_ORG_ID == '' || env.VERCEL_PROJECT_ID == '' }}
        run: |
          echo "Vercel deployment skipped because required repository secrets are missing."
          echo "Configure VERCEL_TOKEN and VERCEL_ORG_ID, plus VERCEL_SCENARIO_PROJECT_ID for the scenario branch or VERCEL_PROJECT_ID for main."
